<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Khmer TTS">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4a57"/><stop offset="1" stop-color="#c9101f"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <!-- waveform rising into a voice peak, ending in an on-air dot -->
  <g fill="#fff">
    <rect x="11" y="27" width="5" height="10" rx="2.5"/>
    <rect x="19" y="21" width="5" height="22" rx="2.5"/>
    <rect x="27" y="14" width="5" height="36" rx="2.5"/>
    <rect x="35" y="22" width="5" height="20" rx="2.5"/>
  </g>
  <circle cx="48.5" cy="32" r="5" fill="#fff"/>
  <circle cx="48.5" cy="32" r="8.5" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
</svg>
